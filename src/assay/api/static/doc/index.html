  <script>
    // Before first paint: theme ("qfv-theme", shared with QFinVerse and the app) and language.
    (function () {
      var m = "system", lang = "";
      try { m = localStorage.getItem("qfv-theme") || "system"; lang = localStorage.getItem("assay_lang") || ""; } catch (e) {}
      var dark = m === "dark" || (m === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("dark", dark);
      if (!lang) lang = (navigator.language || "en").toLowerCase().indexOf("zh") === 0 ? "zh" : "en";
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    })();
  </script>
