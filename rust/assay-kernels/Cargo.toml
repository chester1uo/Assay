[package]
name = "assay-kernels"
version = "0.3.1"
edition = "2021"
description = "Native kernels for Assay (ranks, IC, quantile buckets, rolling time-series)"
license = "Apache-2.0"

[lib]
name = "assay_kernels"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py311"] }
numpy = "0.22"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
