<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 760 260" width="760" height="260" role="img" aria-label="数据导入：从数据商接口到 Parquet 存储"><style>
.f-box{fill:var(--fig-box,#FFFFFF);stroke:var(--fig-line,#CBD0DC);stroke-width:1}
.f-group{fill:var(--fig-group,#F4F6FA);stroke:var(--fig-line,#CBD0DC);stroke-width:1}
.f-acc{fill:var(--fig-accent-bg,#E3F6F2);stroke:var(--fig-accent,#00A38B);stroke-width:1.2}
