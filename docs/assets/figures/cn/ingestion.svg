.f-dot-ok{fill:var(--fig-accent,#00A38B)} .f-dot-part{fill:var(--fig-gold,#B7791F)} .f-dot-plan{fill:none;stroke:var(--fig-muted,#5A6477);stroke-width:1.2}
@media (prefers-color-scheme:dark){svg.fig{--fig-box:#1F232E;--fig-line:#3A3F4C;--fig-group:#171B25;--fig-text:#D7DAE1;--fig-muted:#8A8F9C;--fig-arrow:#6E7484;--fig-accent:#00D6B3;--fig-accent-bg:#11302C;--fig-warm:#FF7A3D;--fig-warm-bg:#3A2418;--fig-gold:#E3B341;--fig-gold-bg:#352B14}}
</style><rect x="12" y="12" width="340" height="236" rx="10" class="f-group"/><text x="28" y="36" class="f-m" text-anchor="start">MassiveConnector</text><rect x="28" y="52" width="308" height="38" rx="8" class="f-box"/><text x="40" y="68" class="f-m" text-anchor="start">fetch_ohlcv()</text><text x="40" y="83" class="f-s" text-anchor="start">→ 原始 OHLCV</text><rect x="28" y="98" width="308" height="38" rx="8" class="f-box"/><text x="40" y="114" class="f-m" text-anchor="start">fetch_adj_events()</text><text x="40" y="129" class="f-s" text-anchor="start">→ 公司行动记录</text><rect x="28" y="144" width="308" height="38" rx="8" class="f-box"/><text x="40" y="160" class="f-m" text-anchor="start">fetch_universe()</text><text x="40" y="175" class="f-s" text-anchor="start">→ 成分股快照</text><rect x="28" y="190" width="308" height="38" rx="8" class="f-box"/><text x="40" y="206" class="f-m" text-anchor="start">fetch_financials()</text><text x="40" y="221" class="f-s" text-anchor="start">→ 时点财务数据</text><path d="M352,130 L392,130" class="f-a"/><path d="M392.0,130.0 L384.8,133.5 L384.8,126.5 Z" class="f-head"/><rect x="394" y="12" width="220" height="236" rx="10" class="f-group"/><text x="410" y="36" class="f-m" text-anchor="start">DataIngester</text><rect x="410" y="52" width="188" height="38" rx="8" class="f-box"/><text x="422" y="68" class="f-m" text-anchor="start">validate_schema()</text><text x="422" y="83" class="f-s" text-anchor="start">坏行隔离</text><path d="M504,90 L504,98" class="f-a"/><rect x="410" y="98" width="188" height="38" rx="8" class="f-box"/><text x="422" y="114" class="f-m" text-anchor="start">deduplicate()</text><text x="422" y="129" class="f-s" text-anchor="start">去掉完全重复的行</text><path d="M504,136 L504,144" class="f-a"/><rect x="410" y="144" width="188" height="38" rx="8" class="f-box"/><text x="422" y="160" class="f-m" text-anchor="start">normalize_timezone()</text><text x="422" y="175" class="f-s" text-anchor="start">按 NYSE 交易日历</text><path d="M504,182 L504,190" class="f-a"/><rect x="410" y="190" width="188" height="38" rx="8" class="f-box"/><text x="422" y="206" class="f-m" text-anchor="start">write_parquet()</text><text x="422" y="221" class="f-s" text-anchor="start">追加到分区</text><path d="M614,130 L642,130" class="f-a"/><path d="M642.0,130.0 L634.8,133.5 L634.8,126.5 Z" class="f-head"/><path d="M646,100 v64 a50.0,10 0 0 0 100,0 v-64" class="f-acc"/><ellipse cx="696.0" cy="100" rx="50.0" ry="10" class="f-acc"/><text x="696.0" y="138" class="f-t" text-anchor="middle">DataStore</text><text x="696.0" y="154" class="f-s" text-anchor="middle">Parquet</text></svg>
