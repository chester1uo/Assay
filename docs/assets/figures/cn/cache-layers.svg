</style><rect x="110" y="16" width="634" height="86" rx="10" class="f-acc"/><text x="130" y="42" class="f-t" text-anchor="start">L2 因子缓存 · 磁盘 Parquet（每个因子约 1 MB）</text><text x="130" y="62" class="f-s" text-anchor="start">键：hash(表达式, 股票池, 区间, 复权版本)</text><text x="130" y="78" class="f-s" text-anchor="start">存完整的 T × N 因子矩阵</text><text x="130" y="94" class="f-s" text-anchor="start">复权版本变化时失效</text><circle cx="62" cy="59" r="22" class="f-acc"/><text x="62" y="64" class="f-t" text-anchor="middle">L2</text><rect x="110" y="116" width="634" height="86" rx="10" class="f-box"/><text x="130" y="142" class="f-t" text-anchor="start">L1 算子缓存 · 内存 arena 块，float32</text><text x="130" y="162" class="f-s" text-anchor="start">键：(算子, 字段, 窗口, 市场, 股票池, 区间)</text><text x="130" y="178" class="f-s" text-anchor="start">存中间结果，如 ts_mean(close, 20)</text><text x="130" y="194" class="f-s" text-anchor="start">淘汰：LFU + EMA 热度</text><circle cx="62" cy="159" r="22" class="f-box"/><text x="62" y="164" class="f-t" text-anchor="middle">L1</text><rect x="110" y="216" width="634" height="86" rx="10" class="f-group"/><text x="130" y="242" class="f-t" text-anchor="start">增量维护</text><text x="130" y="262" class="f-s" text-anchor="start">每日追加：线性滑窗算子 O(1) 更新</text><text x="130" y="278" class="f-s" text-anchor="start">按拓扑顺序更新依赖项</text><circle cx="62" cy="259" r="22" class="f-group"/><text x="62" y="264" class="f-t" text-anchor="middle">Δ</text><path d="M62,65 L62,137" class="f-a"/><path d="M62.0,137.0 L58.5,129.8 L65.5,129.8 Z" class="f-head"/><path d="M62,165 L62,237" class="f-a"/><path d="M62.0,237.0 L58.5,229.8 L65.5,229.8 Z" class="f-head"/><text x="20" y="104" class="f-ms" text-anchor="start">未命中</text><text x="20" y="204" class="f-ms" text-anchor="start">未命中</text></svg>
